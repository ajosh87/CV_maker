[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-maker"
version = "0.1.0"
description = "Tailor your CV to job postings on your own computer; your data never leaves it except to the LLM you choose."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "python-docx>=1.1",
  "pdfminer.six>=20240706",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "playwright>=1.63.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
openai = ["openai>=1.0"]
azure = ["openai>=1.0"]  # AzureOpenAI is part of the openai package
bedrock = ["boto3>=1.28"]
ollama = ["ollama>=0.3"]
groq = ["groq>=0.4"]
# The apply assistant. After installing, run once: python -m playwright install chromium
apply = ["playwright>=1.40", "keyring>=24"]

[project.scripts]
cv-tailor = "cv_maker.__main__:main"

[tool.setuptools.packages.find]
include = ["cv_maker*"]
exclude = ["data*", "tests*"]

[tool.setuptools.package-data]
cv_maker = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
