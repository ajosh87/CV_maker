[project]
name = "cv-maker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0",
  "langgraph>=0.2",
  "langchain-core>=0.3",
  "python-docx>=1.1",
  "pdfminer.six>=20240706",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
